name: DeckTerm
options:
  bundleIdPrefix: dev.cobanov
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
packages:
  # libghostty, Ghostty's terminal core, as a prebuilt XCFramework with a UIKit view.
  libghostty-spm:
    url: https://github.com/Lakr233/libghostty-spm
    exactVersion: 2.2.2026103001
  # The same version herdrchat ships, so both apps run on one tested SSH stack.
  Citadel:
    url: https://github.com/orlandos-nl/Citadel
    exactVersion: 0.12.1
settings:
  base:
    DEVELOPMENT_TEAM: 6U58AKY6F8
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    # 1.0 is the App Store's; TestFlight builds count 1, 2, 3 within a version (scripts/next_build.py).
    MARKETING_VERSION: "1.2"
    CURRENT_PROJECT_VERSION: "1"
targets:
  DeckTerm:
    type: application
    platform: iOS
    sources: [DeckTerm]
    dependencies:
      - package: libghostty-spm
        product: GhosttyTerminal
      - package: Citadel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.cobanov.deckterm
        PRODUCT_NAME: DeckTerm
        # scripts/release.sh signs through these; set on the command line they would hit the package targets too.
        CODE_SIGN_STYLE: $(DECKTERM_SIGN_STYLE:default=Automatic)
        CODE_SIGN_IDENTITY: $(DECKTERM_SIGN_IDENTITY:default=Apple Development)
        PROVISIONING_PROFILE_SPECIFIER: $(DECKTERM_PROFILE)
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: DeckTerm
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        # The iPhone opens in landscape, held as the deck holds it; when Settings lets it turn, AppDelegate adds portrait.
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: DeckTerm connects to SSH servers on your local network.
        # Only standard SSH crypto, as herdrchat declares for the same stack.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  DeckTermTests:
    type: bundle.unit-test
    platform: iOS
    sources: [DeckTermTests]
    dependencies:
      - target: DeckTerm
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.cobanov.deckterm.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/DeckTerm.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/DeckTerm"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  DeckTerm:
    build:
      targets:
        DeckTerm: all
        DeckTermTests: [test]
    # Local tip products for the simulator; TestFlight and the App Store use App Store Connect's.
    run:
      storeKitConfiguration: DeckTerm.storekit
    test:
      targets: [DeckTermTests]
